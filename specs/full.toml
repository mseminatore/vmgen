[vm]
name = "fullvm"
version = "2.0"
dispatch = "auto"
types = ["int64", "double", "bool", "string", "object"]
constants = ["int64", "double", "string"]

[vm.constant_pool]
type = "dynamic"
initial_capacity = 256

[vm.frames]
type = "dynamic"
max_depth = 64

[[vm.vm_extensions]]
name = "globals"
type = "void *"
comment = "Global variable table"

[[vm.vm_extensions]]
name = "user_data"
type = "void *"

[vm.stack]
type = "dynamic"
max_depth = 4096
value_type = "tagged_union"

[vm.features]
interned_strings = true
closures = true
coroutines = true
debug_tracing = true
nan_boxing = false
exception_handling = true
expose_dispatch_table = true

[vm.features.garbage_collection]
enabled = true
strategy = "mark_sweep"

[vm.features.modules]
enabled = true
loading = "dynamic"

[[vm.instructions]]
name = "PUSH_CONST"
description = "Push constant at index onto stack"
action = "push constants[$index]"
operands = [{name = "index", type = "uint16"}]

[[vm.instructions]]
name = "POP"
description = "Pop top of stack"
action = "pop _"
operands = []

[[vm.instructions]]
name = "ADD"
description = "Pop two values, push their sum"
stack_effect = -1
operands = []
typed_action = { int64 = "pop b; pop a; push a + b", double = "pop b; pop a; push a + b" }

[[vm.instructions]]
name = "SUB"
description = "Pop two values, push their difference"
action = "pop b; pop a; push a - b"
stack_effect = -1
operands = []

[[vm.instructions]]
name = "MUL"
description = "Pop two values, push their product"
action = "pop b; pop a; push a * b"
stack_effect = -1
operands = []

[[vm.instructions]]
name = "DIV"
description = "Pop two values, push their quotient"
action = "pop b; pop a; push a / b"
stack_effect = -1
operands = []

[[vm.instructions]]
name = "EQ"
description = "Pop two values, push true if equal"
action = "pop b; pop a; push a == b"
stack_effect = -1
operands = []

[[vm.instructions]]
name = "LT"
description = "Pop two values, push true if a < b"
action = "pop b; pop a; push a < b"
stack_effect = -1
operands = []

[[vm.instructions]]
name = "JUMP"
description = "Unconditional jump by offset"
action = "jump $offset"
operands = [{name = "offset", type = "int16"}]

[[vm.instructions]]
name = "JUMP_IF_FALSE"
description = "Jump by offset if top of stack is false"
action = "pop a; jump_if_zero a $offset"
operands = [{name = "offset", type = "int16"}]

[[vm.instructions]]
name = "CALL"
description = "Call function at index with arity arguments"
action = "call $func_index $arity"
operands = [{name = "func_index", type = "uint16"}, {name = "arity", type = "uint8"}]

[[vm.instructions]]
name = "RETURN"
description = "Return from current function"
action = "return"
operands = []

[[vm.instructions]]
name = "HALT"
description = "Stop execution"
action = "halt"
operands = []

[[vm.instructions]]
name = "TRY_BEGIN"
description = "Begin try block; handler at ip + offset"
action = "try_begin $handler_offset"
operands = [{name = "handler_offset", type = "int16"}]

[[vm.instructions]]
name = "TRY_END"
description = "End try block; pop exception frame"
action = "try_end"
operands = []

[[vm.instructions]]
name = "CATCH"
description = "Catch exception; push exception value"
action = "catch ex; push ex"
operands = []

[[vm.instructions]]
name = "THROW"
description = "Throw top of stack as exception"
action = "pop ex; throw ex"
operands = []
